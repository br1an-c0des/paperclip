# Dependabot, for this hard fork: security updates only.
#
# The fork froze upstream's lockfile at `upstream-freeze` and takes dependency changes by choice
# (CLAUDE.md, FORK.md). Upstream's config opened up to 40 version-update pull requests a week,
# most of them for code this fork leaves dormant (the sandbox providers, Daytona). So:
#
# - `open-pull-requests-limit: 0` turns version updates off for an ecosystem. GitHub documents it
#   as the way to keep only security updates: they have a separate limit of their own, and take
#   their other options (here the label) from the matching entry.
# - Security updates, and the alerts behind them, are switched on in the repository's settings,
#   not here. They cover every manifest GitHub's dependency graph finds, listed here or not.
# - Only the root pnpm workspace and the workflows' actions are listed. The sandbox providers
#   (scripts/typecheck-sandbox-providers) and Daytona (packages/plugins/sandbox-providers/daytona)
#   are dormant, with lockfiles of their own, so they have no entry.
#
# Upstream's version is readable at the tag: `git show upstream-freeze:.github/dependabot.yml`.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
