<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New task (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Fragment+Mono&amp;display=swap">
<style>
body{margin:0;background:#0a0a0a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;margin:0;padding:0}
textarea,input{font:inherit;color:inherit}
.light{--ground:#f2f2f4;--card:#ffffff;--card-edge:transparent;--shadow:0 1px 2px rgba(17,17,19,.06),0 10px 28px -14px rgba(17,17,19,.2);--shadow-lg:0 2px 6px rgba(17,17,19,.08),0 30px 70px -24px rgba(17,17,19,.38);--well:#e7e7ea;--sel:#ffffff;--sel-shadow:0 1px 3px rgba(17,17,19,.12);--line:#ececf0;--row-line:#f0f0f3;--hover:#e7e7ea;--row-hover:#f8f8fa;--code:#f6f6f8;--text:#111113;--body:#45454d;--muted:#6b6b75;--edge:#cfcfd6;--dashed:#b4b4bd;--primary:#111113;--on-primary:#ffffff;--run-bg:#ecebff;--run-fg:#3b2fc0;--violet-bg:#f6e6ff;--violet-fg:#7a1fb8;--amber-bg:#fff1dc;--amber-fg:#94480a;--red-bg:#fde7ea;--red-fg:#b0102a;--green-bg:#e2f6e5;--green-fg:#17672f;--cyan-bg:#dcf4f1;--cyan-fg:#0e6a61;--pri-on:#111113;--pri-off:#dcdce2;--ash-a:#c9c9cf;--ash-b:#9a9aa3;--scrim:rgba(17,17,19,.34);--grain-blend:soft-light;--grain-op:.9}
.dark{--ground:#0a0a0a;--card:#141414;--card-edge:#1f1f1f;--shadow:inset 0 1px 0 rgba(255,255,255,.04),0 16px 34px -18px rgba(0,0,0,.95);--shadow-lg:inset 0 1px 0 rgba(255,255,255,.06),0 34px 80px -20px rgba(0,0,0,.95);--well:#161616;--sel:#262626;--sel-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 3px rgba(0,0,0,.7);--line:#1f1f1f;--row-line:#1a1a1a;--hover:#1a1a1a;--row-hover:#181818;--code:#0f0f0f;--text:#f4f1ea;--body:#c9c6bf;--muted:#8f8c86;--edge:#2c2c2c;--dashed:#4a4843;--primary:#f4f1ea;--on-primary:#0a0a0a;--run-bg:#17142b;--run-fg:#c9c2ff;--violet-bg:rgba(139,44,240,.15);--violet-fg:#dcb8ff;--amber-bg:rgba(247,181,47,.1);--amber-fg:#ffc98a;--red-bg:rgba(242,40,111,.12);--red-fg:#ff9aa8;--green-bg:rgba(47,209,47,.1);--green-fg:#9be59b;--cyan-bg:rgba(34,181,165,.12);--cyan-fg:#8fe3d8;--pri-on:#f4f1ea;--pri-off:#2c2c2c;--ash-a:#3a3a3a;--ash-b:#6b6b6b;--scrim:rgba(0,0,0,.62);--grain-blend:overlay;--grain-op:.75}
.light,.dark{--g-ion:linear-gradient(180deg,#8b2cf0,#1f6fe0);--g-orchid:linear-gradient(180deg,#ff2bd6,#8b2cf0);--g-ember:linear-gradient(180deg,#f7b52f,#f5822a);--g-flare:linear-gradient(180deg,#f2286f,#f2272c);--g-lagoon:linear-gradient(180deg,#2fd12f,#22b5a5);--g-ash:linear-gradient(180deg,var(--ash-a),var(--ash-b))}
.f-hanken{--display:'Hanken Grotesk',system-ui,sans-serif;--dtrack:-.045em}
.f-bricolage{--display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;--dtrack:-.035em}
.disp{font-family:var(--display);letter-spacing:var(--dtrack)}
.mono{font-family:'Fragment Mono',ui-monospace,monospace}
.card{background:var(--card);border:1px solid var(--card-edge);border-radius:18px;box-shadow:var(--shadow)}
.grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:var(--grain-blend);opacity:var(--grain-op);pointer-events:none}
.no-grain .grain{display:none}
a{color:var(--text)}
:focus-visible{outline:2px solid var(--run-fg);outline-offset:2px}
.phone{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:var(--ground);color:var(--text);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.4}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--body);text-decoration:none;flex-shrink:0;box-sizing:border-box}
.ib:hover,.ghost:hover,.chip:hover{background:var(--hover)}
.cap{position:relative;overflow:hidden;display:inline-block;border-radius:999px;flex-shrink:0}
.disc{display:grid;place-items:center;border-radius:50%;color:#111113;font-weight:800;flex-shrink:0;letter-spacing:0;box-sizing:border-box}
.pri{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex-shrink:0}
.pri i{width:4px;border-radius:999px;background:var(--pri-off)}
.pri i:nth-child(1){height:7px}.pri i:nth-child(2){height:10px}.pri i:nth-child(3){height:14px}
.pri.p2 i:nth-child(-n+2){background:var(--pri-on)}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;box-sizing:border-box;border-radius:999px;border:1px solid var(--edge);color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none}
.field{display:block;width:100%;box-sizing:border-box;border:1px solid var(--edge);border-radius:14px;background:var(--ground);color:var(--text);outline:none}
.field:focus{border-color:var(--run-fg);box-shadow:0 0 0 1px var(--run-fg)}
.field::placeholder{color:var(--muted)}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.frow{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 4px 0 2px;border-top:1px solid var(--row-line);font-size:14px}
.frow .k{width:84px;flex-shrink:0;color:var(--muted);font-size:13px}
</style>
</helmet>
<div class="phone {{rootClass}}">
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>

<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 12px">
  <div class="card" style="height: 214px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <span style="width: 170px; height: 12px; border-radius: 6px; background: var(--well)"></span>
    <span class="disp" style="font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05">trading workbench</span>
    <span style="width: 210px; height: 12px; border-radius: 6px; background: var(--well)"></span>
    <span style="margin-top: auto; height: 44px; border-radius: 999px; background: var(--well)"></span>
  </div>
  <div class="card" style="height: 300px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <span style="display: flex; align-items: center; gap: 10px"><span class="cap" style="width: 8px; height: 20px; background: var(--g-ion)"></span><span class="disp" style="font-size: 17px; font-weight: 800; letter-spacing: -.01em">In progress</span></span>
    <span style="height: 12px; width: 80%; border-radius: 6px; background: var(--well)"></span>
    <span style="height: 12px; width: 64%; border-radius: 6px; background: var(--well)"></span>
    <span style="height: 12px; width: 72%; border-radius: 6px; background: var(--well)"></span>
  </div>
</div>

<a href="Main.dc.html" aria-label="Close New task" style="position: absolute; inset: 0; z-index: 40; background: var(--scrim)"></a>

<section role="dialog" aria-modal="true" aria-labelledby="nt-h" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 92%; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; background: var(--card); border: 1px solid var(--card-edge); border-bottom: 0; box-shadow: var(--shadow-lg)">
  <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; margin-top: 8px; border-radius: 999px; background: var(--edge)"></span>
  <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 0 20px">
    <h2 id="nt-h" class="disp" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em">New task</h2>
    <button class="ghost" aria-haspopup="listbox" aria-label="Project: trading workbench" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 6px; border-radius: 999px; color: var(--body); font-size: 13px; font-weight: 600">
      <span class="disc disp" style="width: 20px; height: 20px; font-size: 10px; background: linear-gradient(160deg, #f7b52f, #f5822a)">t</span>trading workbench<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color: var(--muted)"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <a class="ib" href="Main.dc.html" aria-label="Close" style="margin-left: auto; color: var(--muted)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
  </div>

  <form style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 10px 16px 16px">
    <label class="vh" for="nt-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Title</label>
    <input id="nt-title" class="field disp" value="Add OKX funding history to the backfill" style="height: 56px; padding: 0 14px; font-size: 20px; font-weight: 800; letter-spacing: -.01em">
    <label for="nt-desc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Description</label>
    <textarea id="nt-desc" class="field" rows="3" placeholder="Add a description, paste a link, or type / for a template" style="resize: none; padding: 12px 14px; font-size: 15px; line-height: 1.45"></textarea>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" class="chip" aria-haspopup="listbox" aria-label="Status: Todo"><span class="cap" style="width: 7px; height: 18px; background: var(--g-ember)"><svg class="grain"><rect width="100%" height="100%" filter="url(#grain)"></rect></svg></span>Todo</button>
      <button type="button" class="chip" aria-haspopup="listbox" aria-label="Priority: Medium"><span class="pri p2" aria-hidden="true"><i></i><i></i><i></i></span>Medium</button>
      <button type="button" class="chip" aria-haspopup="listbox" style="color: var(--body)"><span style="width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #2fd12f, #22b5a5)"></span>data</button>
      <button type="button" class="chip" aria-label="Add label" style="border-style: dashed; border-color: var(--dashed); color: var(--muted); padding: 0 12px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Label</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Assign to</span>
      <button type="button" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px 0 8px; border-radius: 999px; border: 1px solid var(--edge); background: var(--ground); text-align: left">
        <span style="padding: 2px; border-radius: 50%; background: var(--g-ion)"><span class="disc" style="width: 36px; height: 36px; font-size: 11px; border: 2px solid var(--ground); background: linear-gradient(160deg, #2fd12f, #22b5a5)">QR</span></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
          <span style="font-weight: 700">Quant Researcher</span>
          <span style="font-size: 12px; color: var(--muted)">Opus 5.5 · high effort · the agent's default</span>
        </span>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="color: var(--muted)"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <sc-if value="{{moreOpen}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column">
        <button type="button" class="frow ghost" style="text-align: left"><span class="k">Reviewer</span><span class="disc" style="width: 22px; height: 22px; font-size: 8px; background: var(--primary); color: var(--on-primary)">BA</span>You</button>
        <button type="button" class="frow ghost" style="text-align: left"><span class="k">Parent</span><span class="mono" style="font-size: 12px; color: var(--muted)">TRA-41</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">H4 download derivatives price data</span></button>
        <button type="button" class="frow ghost" style="text-align: left"><span class="k">Goal</span><span style="color: var(--muted)">Pick a goal</span></button>
      </div>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" class="chip" style="color: var(--body)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"></path></svg>Attach</button>
      <button type="button" class="chip" aria-label="Take a photo" style="color: var(--body); padding: 0 12px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg></button>
      <button type="button" class="ghost" onClick="{{toggleMore}}" aria-expanded="{{moreExpanded}}" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 999px; color: var(--muted); font-size: 13px; font-weight: 700">{{moreLabel}}<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="transform: rotate({{moreRot}})"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
  </form>

  <div style="display: flex; gap: 8px; padding: 12px 16px 18px; border-top: 1px solid var(--line); background: var(--ground); border-radius: 0">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; height: 50px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--edge); color: var(--body); font-weight: 700; text-decoration: none">Cancel</a>
    <a href="Main.dc.html" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 800; text-decoration: none">Create task</a>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]},"display":{"editor":"enum","default":"Hanken Grotesk","options":["Hanken Grotesk","Bricolage Grotesque"]},"grain":{"editor":"boolean","default":true},"moreOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { more: null };
  }
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const font = (this.props.display ?? 'Hanken Grotesk') === 'Bricolage Grotesque' ? 'f-bricolage' : 'f-hanken';
    const more = this.state.more ?? (this.props.moreOpen ?? false);
    return {
      rootClass: (dark ? 'dark' : 'light') + ' ' + font + ((this.props.grain ?? true) ? '' : ' no-grain'),
      moreOpen: more,
      moreExpanded: more ? 'true' : 'false',
      moreRot: more ? '180deg' : '0deg',
      moreLabel: more ? 'Fewer fields' : 'More fields',
      toggleMore: () => this.setState({ more: !more })
    };
  }
}
</script>
</body>
</html>
