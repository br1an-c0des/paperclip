<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agents (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Fragment+Mono&amp;display=swap">
<style>
body{margin:0;background:#0a0a0a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;margin:0;padding:0}
.light{--ground:#f2f2f4;--card:#ffffff;--card-edge:transparent;--shadow:0 1px 2px rgba(17,17,19,.06),0 10px 28px -14px rgba(17,17,19,.2);--shadow-lg:0 2px 6px rgba(17,17,19,.08),0 30px 70px -24px rgba(17,17,19,.38);--well:#e7e7ea;--sel:#ffffff;--sel-shadow:0 1px 3px rgba(17,17,19,.12);--line:#ececf0;--row-line:#f0f0f3;--hover:#e7e7ea;--row-hover:#f8f8fa;--code:#f6f6f8;--text:#111113;--body:#45454d;--muted:#6b6b75;--edge:#cfcfd6;--dashed:#b4b4bd;--primary:#111113;--on-primary:#ffffff;--run-bg:#ecebff;--run-fg:#3b2fc0;--violet-bg:#f6e6ff;--violet-fg:#7a1fb8;--amber-bg:#fff1dc;--amber-fg:#94480a;--red-bg:#fde7ea;--red-fg:#b0102a;--green-bg:#e2f6e5;--green-fg:#17672f;--cyan-bg:#dcf4f1;--cyan-fg:#0e6a61;--pri-on:#111113;--pri-off:#dcdce2;--ash-a:#c9c9cf;--ash-b:#9a9aa3;--scrim:rgba(17,17,19,.34);--grain-blend:soft-light;--grain-op:.9}
.dark{--ground:#0a0a0a;--card:#141414;--card-edge:#1f1f1f;--shadow:inset 0 1px 0 rgba(255,255,255,.04),0 16px 34px -18px rgba(0,0,0,.95);--shadow-lg:inset 0 1px 0 rgba(255,255,255,.06),0 34px 80px -20px rgba(0,0,0,.95);--well:#161616;--sel:#262626;--sel-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 3px rgba(0,0,0,.7);--line:#1f1f1f;--row-line:#1a1a1a;--hover:#1a1a1a;--row-hover:#181818;--code:#0f0f0f;--text:#f4f1ea;--body:#c9c6bf;--muted:#8f8c86;--edge:#2c2c2c;--dashed:#4a4843;--primary:#f4f1ea;--on-primary:#0a0a0a;--run-bg:#17142b;--run-fg:#c9c2ff;--violet-bg:rgba(139,44,240,.15);--violet-fg:#dcb8ff;--amber-bg:rgba(247,181,47,.1);--amber-fg:#ffc98a;--red-bg:rgba(242,40,111,.12);--red-fg:#ff9aa8;--green-bg:rgba(47,209,47,.1);--green-fg:#9be59b;--cyan-bg:rgba(34,181,165,.12);--cyan-fg:#8fe3d8;--pri-on:#f4f1ea;--pri-off:#2c2c2c;--ash-a:#3a3a3a;--ash-b:#6b6b6b;--scrim:rgba(0,0,0,.62);--grain-blend:overlay;--grain-op:.75}
.light,.dark{--g-ion:linear-gradient(180deg,#8b2cf0,#1f6fe0);--g-orchid:linear-gradient(180deg,#ff2bd6,#8b2cf0);--g-ember:linear-gradient(180deg,#f7b52f,#f5822a);--g-flare:linear-gradient(180deg,#f2286f,#f2272c);--g-lagoon:linear-gradient(180deg,#2fd12f,#22b5a5);--g-tide:linear-gradient(180deg,#22b5a5,#4c7896);--g-ash:linear-gradient(180deg,var(--ash-a),var(--ash-b))}
.f-hanken{--display:'Hanken Grotesk',system-ui,sans-serif;--dtrack:-.045em}
.f-bricolage{--display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;--dtrack:-.035em}
.disp{font-family:var(--display);letter-spacing:var(--dtrack)}
.mono{font-family:'Fragment Mono',ui-monospace,monospace}
.card{background:var(--card);border:1px solid var(--card-edge);border-radius:22px;box-shadow:var(--shadow)}
@keyframes breathe{0%,100%{opacity:1;transform:scaleY(1)}50%{opacity:.55;transform:scaleY(.65)}}
.live{animation:breathe 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.live{animation:none}}
a{color:var(--text)}
:focus-visible{outline:2px solid var(--run-fg);outline-offset:2px}
.phone{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:var(--ground);color:var(--text);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.4}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--body);text-decoration:none;flex-shrink:0;box-sizing:border-box}
.ib:hover{background:var(--hover)}
.disc{display:grid;place-items:center;border-radius:50%;color:#111113;font-weight:800;flex-shrink:0;letter-spacing:0;box-sizing:border-box}
.kchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;box-sizing:border-box;border-radius:999px;border:1px solid var(--edge);color:var(--body);font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.kchip[aria-pressed="true"]{background:var(--sel);border-color:transparent;box-shadow:var(--sel-shadow);color:var(--text);font-weight:800}
.st{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
.dock-wrap{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:10px;padding:34px 16px 18px;background:linear-gradient(180deg,transparent,var(--ground) 62%);pointer-events:none}
.dock{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--card);border:1px solid var(--card-edge);box-shadow:var(--shadow-lg)}
.dock a{position:relative;height:46px;min-width:50px;padding:0 14px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;color:var(--body);font-size:14px;font-weight:600;text-decoration:none}
.dock a:hover{background:var(--hover)}
.dock a[aria-current="page"]{background:var(--sel);box-shadow:var(--sel-shadow);color:var(--text);font-weight:800}
.dock .lbl{display:none}
.dock a[aria-current="page"] .lbl{display:inline}
.fab{pointer-events:auto;width:56px;height:56px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-lg);text-decoration:none}
.badge{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:linear-gradient(135deg,#ff2bd6,#f7b52f);color:#111113;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.meter{height:8px;border-radius:4px;background:var(--well);overflow:hidden;display:flex;gap:2px}
.meter span{display:block;height:100%}
.arow{display:flex;align-items:flex-start;gap:12px;padding:14px 12px 14px 14px;border-top:1px solid var(--row-line);text-decoration:none;color:var(--text)}
.arow:first-child{border-top:0}
.arow:hover{background:var(--row-hover)}
.av{position:relative;width:48px;height:48px;flex-shrink:0}
.av img{display:block;width:48px;height:48px}
.av .s{position:absolute;right:2px;bottom:4px;width:6px;height:14px;border-radius:999px;box-shadow:0 0 0 2.5px var(--card)}
.arow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:2px}
.arow .nm{display:flex;align-items:baseline;gap:8px;min-width:0}
.arow .nm b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .nm small{font-size:12px;color:var(--muted);white-space:nowrap}
.arow .ln{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;color:var(--body)}
.arow .ln span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .ask{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--cyan-bg);color:var(--cyan-fg);font-size:12px;font-weight:700}
.arow .ask::before{content:"";width:4px;height:10px;border-radius:999px;background:var(--g-tide)}
.arow .end{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:3px;flex-shrink:0;font-size:12px;color:var(--muted)}
</style>
</helmet>
<div class="phone {{rootClass}}">
<div class="scroll" style="padding-bottom: 112px">
  <header style="display: flex; align-items: center; gap: 4px; padding: 14px 8px 4px 20px">
    <h1 class="disp" style="margin: 0; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.02em">Agents</h1>
    <div style="margin-left: auto; display: flex">
      <a class="ib" href="Search.dc.html" aria-label="Search agents"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a>
      <button class="ib" aria-label="More: org chart, hire an agent" aria-haspopup="menu"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg></button>
    </div>
  </header>

  <section class="card" aria-label="This month" style="margin: 12px 12px 0; padding: 16px 16px 14px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted)">OCTOBER SPEND</span>
      <span style="margin-left: auto; font-size: 12px; color: var(--muted)">5 days left</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin: 6px 0 10px">
      <span class="disp" style="font-size: 30px; font-weight: 800; line-height: 1">$214.60</span>
      <span style="font-size: 13px; color: var(--muted)">of $400 company budget</span>
    </div>
    <div class="meter" role="img" aria-label="Spend by agent: Quant Researcher $62, Strategy Engineer $48, Frontend Engineer $80, others $25 of $400">
      <span style="width: 15.5%; background: linear-gradient(90deg, #2fd12f, #22b5a5)"></span>
      <span style="width: 12%; background: linear-gradient(90deg, #ff2bd6, #f2286f)"></span>
      <span style="width: 20%; background: linear-gradient(90deg, #f7b52f, #f5822a)"></span>
      <span style="width: 6.2%; background: var(--g-ash)"></span>
    </div>
    <div style="display: flex; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--body)">
      <span style="display: inline-flex; align-items: center; gap: 6px"><span class="live" aria-hidden="true" style="width: 5px; height: 12px; border-radius: 999px; background: var(--g-ion)"></span><b style="font-weight: 800; color: var(--text)">2</b> running</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 5px; height: 12px; border-radius: 999px; background: var(--g-flare)"></span><b style="font-weight: 800; color: var(--text)">1</b> blocked</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 5px; height: 12px; border-radius: 999px; background: var(--g-ember)"></span><b style="font-weight: 800; color: var(--text)">1</b> paused</span>
    </div>
  </section>

  <div class="hscroll" role="group" aria-label="Filter agents" style="display: flex; gap: 6px; padding: 14px 12px 10px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button class="kchip" aria-pressed="{{f.pressed}}" onClick="{{f.select}}">{{f.label}}<span style="color: var(--muted); font-weight: 600">{{f.count}}</span></button>
    </sc-for>
  </div>

  <section class="card" aria-label="Agents" style="margin: 0 12px; overflow: hidden">
    <sc-for list="{{agents}}" as="a" hint-placeholder-count="5">
      <a class="arow" href="{{a.href}}" aria-label="{{a.label}}">
        <span class="av">
          <sc-if value="{{a.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{a.src}}" alt="" width="48" height="48"></sc-if>
          <sc-if value="{{a.noImg}}" hint-placeholder-val="{{false}}"><span class="disc" style="width: 48px; height: 48px; font-size: 15px; background: {{a.grad}}">{{a.initials}}</span></sc-if>
          <span class="s {{a.liveClass}}" aria-hidden="true" style="background: {{a.capsule}}"></span>
        </span>
        <span class="tx">
          <span class="nm"><b>{{a.name}}</b><small>{{a.model}}</small></span>
          <span class="ln"><span class="st" style="background: {{a.stBg}}; color: {{a.stFg}}">{{a.status}}</span><span class="t">{{a.line}}</span></span>
          <span class="sub mono" style="display: {{a.subDisplay}}">{{a.sub}}</span>
          <span class="ask" style="display: {{a.askDisplay}}">{{a.ask}}</span>
        </span>
        <span class="end">
          <span>{{a.time}}</span>
          <span class="badge" style="display: {{a.unreadDisplay}}">{{a.unread}}</span>
        </span>
      </a>
    </sc-for>
  </section>

  <a href="Inbox.dc.html" style="display: flex; align-items: center; gap: 12px; margin: 12px 12px 0; padding: 12px 14px; border: 1.5px dashed var(--dashed); border-radius: 22px; text-decoration: none; color: var(--text)">
    <span class="disc" aria-hidden="true" style="width: 40px; height: 40px; font-size: 13px; background: linear-gradient(160deg, #f2272c, #f5822a); opacity: .55">RA</span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <span style="font-weight: 700">Risk Analyst</span>
      <span style="font-size: 13px; color: var(--muted)">Hire waiting on your approval in the Inbox</span>
    </span>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--muted)"><path d="m9 6 6 6-6 6"></path></svg>
  </a>
</div>

<div class="dock-wrap">
  <nav class="dock" aria-label="Main">
    <a href="Inbox.dc.html" aria-label="Inbox, 8 need you"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span class="lbl">Inbox</span><span class="badge">8</span></a>
    <a href="Main.dc.html" aria-label="Tasks"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="3.5"></rect><rect x="3" y="13" width="18" height="7" rx="3.5"></rect></svg><span class="lbl">Tasks</span></a>
    <a href="Agents.dc.html" aria-current="page"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-8a7 7 0 0 1 14 0v8z"></path><path d="M9.5 13h.01M14.5 13h.01"></path></svg><span class="lbl">Agents</span><span class="live" aria-hidden="true" style="width: 4px; height: 11px; border-radius: 999px; background: var(--g-ion)"></span></a>
  </nav>
  <a class="fab" href="NewTask.dc.html" aria-label="New task"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["light","dark"]},"display":{"editor":"enum","default":"Hanken Grotesk","options":["Hanken Grotesk","Bricolage Grotesque"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const font = (this.props.display ?? 'Hanken Grotesk') === 'Bricolage Grotesque' ? 'f-bricolage' : 'f-hanken';
    const S = {
      running: { label: 'RUNNING', bg: 'var(--run-bg)', fg: 'var(--run-fg)', capsule: 'var(--g-ion)', group: 'running' },
      blocked: { label: 'BLOCKED', bg: 'var(--red-bg)', fg: 'var(--red-fg)', capsule: 'var(--g-flare)', group: 'attention' },
      paused: { label: 'PAUSED', bg: 'var(--amber-bg)', fg: 'var(--amber-fg)', capsule: 'var(--g-ember)', group: 'attention' },
      idle: { label: 'IDLE', bg: 'var(--well)', fg: 'var(--muted)', capsule: 'var(--g-ash)', group: 'idle' }
    };
    const list = [
      { name: 'Quant Researcher', initials: 'QR', src: '/_blob/7aaa93c4d4541bd76051e13cbe0ea6a7', model: 'Opus 5.5', state: 'running', line: 'TRA-41 · run #7 · 18m', sub: '> writing sol_liq_4h.parquet  62%', unread: '2', href: 'AgentChat.dc.html' },
      { name: 'Strategy Engineer', initials: 'SE', src: '/_blob/923b60a102d23a6e59f85ad0632aeb19', model: 'Opus 5.5', state: 'running', line: 'TRA-38 · run #12 · 6m', sub: '> porting center_of_gravity.pine', ask: 'Waiting on 2 answers from you', href: '#' },
      { name: 'ML Engineer', initials: 'ML', src: '/_blob/e9322069f1f2ecddbd54eb0a09925910', model: 'Opus 5.5', state: 'blocked', line: 'TRA-45 waits on SOL data from TRA-41', time: '1h', href: '#' },
      { name: 'Frontend Engineer', initials: 'FE', src: '/_blob/3b04710f48e2284cfab9eeffb5bf5d4b', model: 'Sonnet 5.5', state: 'paused', line: 'Hit its October limit · $80.25 of $80', time: '12m', href: 'Inbox.dc.html' },
      { name: 'CEO', initials: 'CE', grad: 'linear-gradient(160deg, #6a93ad, #a9c6d6)', model: 'Opus 5.5', state: 'idle', line: 'Last run 2h ago · proposed a fix for TRA-45', time: '2h', unread: '1', href: '#' }
    ];
    const filter = this.state.filter;
    const inFilter = (a) => filter === 'all' || S[a.state].group === filter;
    const agents = list.filter(inFilter).map((a) => {
      const s = S[a.state];
      return {
        name: a.name, initials: a.initials, model: a.model, line: a.line, href: a.href,
        label: a.name + ', ' + s.label.toLowerCase() + ', ' + a.line + (a.unread ? ', ' + a.unread + ' unread' : ''),
        hasImg: !!a.src, noImg: !a.src, src: a.src || '', grad: a.grad || 'none',
        status: s.label, stBg: s.bg, stFg: s.fg, capsule: s.capsule,
        liveClass: a.state === 'running' ? 'live' : '',
        sub: a.sub || '', subDisplay: a.sub ? 'block' : 'none',
        ask: a.ask || '', askDisplay: a.ask ? 'inline-flex' : 'none',
        time: a.time || '',
        unread: a.unread || '', unreadDisplay: a.unread ? 'inline-grid' : 'none'
      };
    });
    const count = (g) => String(list.filter((a) => g === 'all' || S[a.state].group === g).length);
    const filters = [['all', 'All'], ['running', 'Running'], ['attention', 'Needs attention'], ['idle', 'Idle']].map(([k, label]) => ({
      label, count: count(k), pressed: k === filter ? 'true' : 'false',
      select: () => this.setState({ filter: k })
    }));
    return { rootClass: (dark ? 'dark' : 'light') + ' ' + font, filters, agents };
  }
}
</script>
</body>
</html>
