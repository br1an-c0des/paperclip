    }, extra || {});
    const defs = [
      { key: 'in_progress', name: 'In progress', glyph: 'var(--g-ion)', tasks: [
        task('TRA-41', 'H4 download derivatives price data', 'qr', 'high', '2m', Object.assign({ href: 'TaskDetail.dc.html', live: true, hasSubtasks: true, subtasks: '1/2' }, note('cyan', 'Asks you'))),

      ] },

      ] },
      { key: 'blocked', name: 'Blocked', glyph: 'var(--g-flare)', tasks: [
        task('TRA-45', 'Start ML testing on VPA', 'ml', 'high', '5h', note('red', 'Blocked by TRA-41'))
      ] },
      { key: 'backlog', name: 'Backlog', glyph: 'var(--g-ash)', tasks: [
        task('TRA-52', 'Explore skilled quant agents to analyze my workflow', 'none', 'low', 'Oct 9'),
        task('TRA-53', 'Hire an assistant agent to run the trading workbench', 'me', 'medium', 'Oct 9'),
        task('TRA-54', 'BB squeeze + VPA strategy refinement', 'none', 'low', 'Oct 8')
      ] },
      { key: 'done', name: 'Done', glyph: 'var(--g-lagoon)', tasks: [

        task('TRA-22', 'Chart theme tokens', 'fe', 'low', 'Oct 3')
      ] }
    ];
    const collapsed = this.state.collapsed;
    const groups = defs.map((g) => Object.assign({}, g, {
      count: g.tasks.length,
      open: !collapsed[g.key],
      expanded: collapsed[g.key] ? 'false' : 'true',
      rot: collapsed[g.key] ? '-90deg' : '0deg',
      toggle: () => this.setState({ collapsed: Object.assign({}, collapsed, { [g.key]: !collapsed[g.key] }) })
    }));
    return {
      rootClass: (dark ? 'dark' : 'light') + ' ' + font + ((this.props.grain ?? true) ? '' : ' no-grain'),
      groups
    };
  }
}
