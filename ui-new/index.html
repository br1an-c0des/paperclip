<!doctype html>
<html lang="en" class="dark f-hanken">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the phone dock sit over the home indicator, inside the safe-area insets (src/layout/PhoneDock.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser's bar and the home-screen app take --ground; src/shell/pwa.tsx follows the theme. -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-title" content="Paperclip" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Paperclip</title>
    <!-- A server serving this page fills in worktree branding here (server/src/ui-branding.ts; src/shell/DevBanners.tsx). -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- The server swaps these for a worktree's coloured favicon (server/src/ui-branding.ts); the files come from ui/public (vite.config.ts). -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
